name: CI PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci:
    uses: caesariodito/.standardization/.github/workflows/reusable-ci-pr-dotnet.yml@v1
    with:
      solution_path: ApiSurveyor.sln
      dotnet_version: 8.0.x
      configuration: Release
      run_tests: true
    secrets: inherit
