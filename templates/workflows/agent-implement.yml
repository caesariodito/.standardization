name: Agent implement

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  implement:
    if: ${{ github.event.label.name == 'agent-trigger:implement' }}
    uses: caesariodito/.standardization/.github/workflows/reusable-agent-implement.yml@v2
    with:
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      runner_label: ${{ vars.AI_IMPLEMENTER_RUNNER_LABEL }}
      router_base_url: ${{ vars.NINE_ROUTER_BASE_URL }}
      model: ${{ vars.AI_IMPLEMENTER_MODEL || 'engineering-implementer' }}
      timeout_minutes: ${{ fromJSON(vars.AI_IMPLEMENTER_TIMEOUT_MINUTES || '60') }}
      check_command: ${{ vars.AI_IMPLEMENTER_CHECK_COMMAND || '' }}
      github_app_id: ${{ vars.AI_GITHUB_APP_ID }}
      infisical_identity_id: ${{ vars.AI_INFISICAL_IDENTITY_ID }}
      infisical_project_id: ${{ vars.AI_INFISICAL_PROJECT_ID }}
      infisical_environment: ${{ vars.AI_INFISICAL_ENVIRONMENT }}
      infisical_base_url: ${{ vars.AI_INFISICAL_BASE_URL || 'https://app.infisical.com' }}
      infisical_oidc_audience: ${{ vars.AI_INFISICAL_OIDC_AUDIENCE || 'infisical' }}
      infisical_secret_path: ${{ vars.AI_INFISICAL_SECRET_PATH || '/' }}
      infisical_app_private_key_secret: ${{ vars.AI_INFISICAL_APP_PRIVATE_KEY_SECRET }}
    secrets: inherit
