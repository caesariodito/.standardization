name: Engineering ticket
description: Submit a problem, feature, documentation change, or operational task.
title: "[Ticket]: "
labels: ["intake-state:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal data/PII, passwords, API keys, tokens, signed links, or other secrets in this issue or referenced content. Redact these from logs, screenshots, and URLs, including customer, employee, and vendor details.

  - type: checkboxes
    id: data_transmission_confirmation
    attributes:
      label: Data-transmission confirmation
      options:
        - label: I confirm this issue and referenced content contain no secrets, credentials, personal data/PII (including customer, employee, or vendor details), or unapproved sensitive data and may be sent to approved model providers.
          required: true

  - type: dropdown
    id: ticket_type
    attributes:
      label: Ticket type
      options:
        - Bug
        - Feature
        - Documentation
        - Operational task
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Reported problem
      description: What problem or need should this ticket address?
      placeholder: Describe the problem without proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected outcome
      description: What observable acceptance criteria would make this ticket complete? A checkbox list is encouraged.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What happens now? Include reproduction steps when relevant.

  - type: textarea
    id: business_impact
    attributes:
      label: Business impact
      description: Who is affected, how severely, and how often?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or evidence
      description: Add logs, screenshots, links, examples, repository paths, or related issue numbers only after redacting personal data/PII and embedded credentials, tokens, or signed links.

  - type: textarea
    id: missing_information
    attributes:
      label: Missing information, constraints, and non-goals
      description: List anything still unknown or requiring confirmation, plus relevant constraints or non-goals.
