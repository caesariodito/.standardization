name: Reusable PR Preview Image

on:
  workflow_call:
    inputs:
      image_name:
        description: "Container image name (without registry/owner)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        default: "./Dockerfile"
        type: string
      context:
        description: "Build context"
        required: false
        default: "."
        type: string
      comment_on_pr:
        description: "Post PR comment with published tags"
        required: false
        default: true
        type: boolean
      extra_build_args:
        description: "Optional additional docker build args (multi-line supported)"
        required: false
        default: ""
        type: string
    secrets:
      GH_PRIVATE_MODULES_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve preview tags
        id: meta
        env:
          GH_PRIVATE_MODULES_TOKEN: ${{ secrets.GH_PRIVATE_MODULES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${{ inputs.image_name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          PREVIEW_VERSION="pr-${PR_NUM}-${SHORT_SHA}"

          {
            echo "image=${IMAGE}"
            echo "tag_pr=pr-${PR_NUM}"
            echo "tag_sha=${PREVIEW_VERSION}"
            echo "preview_version=${PREVIEW_VERSION}"
            echo "build_args<<EOF"
            echo "APP_VERSION=${PREVIEW_VERSION}"
            if [ -n "$GH_PRIVATE_MODULES_TOKEN" ]; then
              echo "GH_PRIVATE_MODULES_TOKEN=${GH_PRIVATE_MODULES_TOKEN}"
            fi
            if [ -n "${{ inputs.extra_build_args }}" ]; then
              echo "${{ inputs.extra_build_args }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_pr }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
          build-args: ${{ steps.meta.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.preview_version }}

      - name: Comment preview tags
        if: ${{ inputs.comment_on_pr }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            PR preview image published:

            - `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_pr }}`
            - `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}`

            Quick pull:

            ```bash
            docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_pr }}
            docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ```
