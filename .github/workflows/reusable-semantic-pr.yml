name: Reusable Semantic PR Title

on:
  workflow_call:
    inputs:
      types:
        description: "Allowed semantic commit types (newline separated)"
        required: false
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
        type: string
      scopes:
        description: "Allowed scopes (newline separated)"
        required: false
        default: |
          api
          docker
          ci
          docs
          config
          infra
          release
        type: string
      require_scope:
        description: "Require a semantic scope"
        required: false
        default: false
        type: boolean
      subject_pattern:
        description: "Regex for semantic PR subject"
        required: false
        default: "^[^\\n]+"
        type: string
      subject_pattern_error:
        description: "Error shown when subject pattern does not match"
        required: false
        default: "Use a single-line summary in the subject."
        type: string
      wip:
        description: "Allow WIP PR titles"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require_scope }}
          subjectPattern: ${{ inputs.subject_pattern }}
          subjectPatternError: ${{ inputs.subject_pattern_error }}
          wip: ${{ inputs.wip }}
