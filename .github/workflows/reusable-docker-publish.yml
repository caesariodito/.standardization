name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image_name:
        description: "Container image name (without registry/owner)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        default: "./Dockerfile"
        type: string
      context:
        description: "Build context"
        required: false
        default: "."
        type: string
      version:
        description: "Optional explicit image version/tag"
        required: false
        default: ""
        type: string
      publish_latest_on_stable:
        description: "Also publish latest for stable semver tags"
        required: false
        default: true
        type: boolean
      extra_build_args:
        description: "Optional additional docker build args (multi-line supported)"
        required: false
        default: ""
        type: string
    secrets:
      GH_PRIVATE_MODULES_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: vars
        env:
          GH_PRIVATE_MODULES_TOKEN: ${{ secrets.GH_PRIVATE_MODULES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Version is required"
            exit 1
          fi

          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${{ inputs.image_name }}"

          TAGS="${IMAGE}:${VERSION}"
          if [ "${{ inputs.publish_latest_on_stable }}" = "true" ] && [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "tags=${TAGS}"
            echo "build_args<<EOF"
            echo "APP_VERSION=${VERSION}"
            if [ -n "$GH_PRIVATE_MODULES_TOKEN" ]; then
              echo "GH_PRIVATE_MODULES_TOKEN=${GH_PRIVATE_MODULES_TOKEN}"
            fi
            if [ -n "${{ inputs.extra_build_args }}" ]; then
              echo "${{ inputs.extra_build_args }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: ${{ steps.vars.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
